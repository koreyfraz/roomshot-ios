name: Build RoomShot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project RoomShot.xcodeproj -target RoomShot \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package RoomShot.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/RoomShot.app Payload/
          zip -qry RoomShot.ipa Payload

      - name: Upload RoomShot.ipa
        uses: actions/upload-artifact@v4
        with:
          name: RoomShot-ipa
          path: RoomShot.ipa

      - name: Upload build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
